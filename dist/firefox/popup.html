<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SessionSwitcher</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #1e293b;
        --panel-hover: #273549;
        --accent: #22c55e;
        --accent-hover: #16a34a;
        --success: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
        --input: #172233;
        --radius: 10px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      body {
        width: 350px;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .ss-icon {
        width: 1.2em;
        height: 1.2em;
        min-width: 1.2em;
        display: inline-block;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      header {
        padding: 16px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--panel);
        border-bottom: 1px solid var(--border);
      }
      header h1 {
        font-size: 15px;
        font-weight: 700;
        margin: 0;
      }
      #domain {
        color: var(--muted);
        font-size: 11px;
      }
      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon-btn {
        background: transparent;
        border: none;
        color: var(--text);
        cursor: pointer;
        padding: 4px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .icon-btn:hover {
        background: var(--border);
      }
      .section {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
      }
      .bottom-toolbar {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 6px;
      }
      .bottom-toolbar:last-of-type {
        border-bottom: none;
      }
      input {
        width: 100%;
        padding: 10px 12px;
        background: var(--input);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: var(--radius);
        font-size: 13px;
        transition: 0.2s;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.18);
      }
      .input-row {
        display: flex;
        gap: 6px;
      }
      #accountName,
      #passphrase {
        flex: 1;
      }
      .main-btn {
        width: 100%;
        padding: 11px;
        border: none;
        border-radius: var(--radius);
        background: var(--accent);
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        font-size: 13px;
      }
      .main-btn:hover {
        background: var(--accent-hover);
      }
      .main-btn:active {
        transform: scale(0.98);
      }
      .main-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .action-btn {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        transition:
          background 0.2s,
          border-color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
        font-size: 12px;
        white-space: nowrap;
      }
      .action-btn:hover {
        background: var(--panel-hover);
        border-color: var(--accent);
      }
      .action-btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .action-btn.delete {
        width: 38px;
        padding: 0;
        flex-shrink: 0;
      }
      .action-btn.delete:hover {
        background: #3b1515;
        border-color: var(--danger);
        color: #fff;
      }
      #accounts {
        max-height: 290px;
        overflow-y: auto;
        padding: 12px;
        scrollbar-width: thin;
        scrollbar-color: var(--accent) var(--bg);
      }
      #accounts::-webkit-scrollbar {
        width: 6px;
      }
      #accounts::-webkit-scrollbar-track {
        background: var(--bg);
      }
      #accounts::-webkit-scrollbar-thumb {
        background: var(--accent);
        border-radius: 10px;
      }
      #accounts::-webkit-scrollbar-thumb:hover {
        background: var(--accent-hover);
      }
      .account-card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
        transition:
          background 0.2s,
          transform 0.2s,
          border-color 0.2s;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .account-card:hover {
        background: var(--panel-hover);
        transform: translateY(-1px);
      }
      .account-card.active-account {
        border-color: var(--success);
        background: rgba(34, 197, 94, 0.08);
        box-shadow:
          inset 0 0 0 1px rgba(34, 197, 94, 0.25),
          0 8px 20px rgba(0, 0, 0, 0.18);
      }
      .account-card.warning-account {
        border-color: var(--danger);
        background: rgba(239, 68, 68, 0.08);
      }
      .account-card.critical-warning {
        border-color: var(--danger);
        background: rgba(239, 68, 68, 0.15);
      }
      .card-header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 8px;
      }
      .account-title-area {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .account-name-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        max-width: 100%;
      }
      .account-icon {
        color: var(--accent);
      }
      .card-pass-input {
        margin-top: 2px;
        padding: 8px 10px;
        font-size: 12px;
        background: rgba(15, 23, 42, 0.5);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        width: 100%;
        transition: 0.2s;
      }
      .card-pass-input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(34, 197, 94, 0.18);
      }
      .quota-badge {
        padding: 4px 8px;
        border-radius: 999px;
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 4px;
        flex-shrink: 0;
      }
      .quota-ready {
        background: rgba(34, 197, 94, 0.14);
        color: var(--success);
      }
      .quota-cooldown {
        background: rgba(245, 158, 11, 0.14);
        color: var(--warning);
      }
      .active-badge {
        font-size: 10px;
        color: var(--success);
        font-weight: 600;
        white-space: nowrap;
      }
      .warning-badge,
      .critical-badge {
        font-size: 10px;
        color: var(--danger);
        font-weight: 600;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .card-actions {
        display: flex;
        gap: 8px;
        margin-top: 2px;
      }
      .card-actions .main-btn {
        flex: 1;
        font-size: 12px;
      }
      #status {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
      }
      #status:not(:empty) {
        padding: 12px 16px;
      }
      #status.success {
        color: var(--success);
      }
      #status.error {
        color: var(--danger);
      }
      #empty-state {
        padding: 20px 14px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      .no-match-note {
        padding: 10px 14px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>SessionSwitcher</h1>
      <div class="header-actions">
        <div id="domain">Loading domain…</div>
        <button id="toggleAddBtn" class="icon-btn" title="Add a new session">
          <svg class="ss-icon" style="stroke-width: 3">
            <use xlink:href="#icon-plus"></use>
          </svg>
        </button>
      </div>
    </header>

    <div id="add-account-form" style="display: none">
      <div id="passphrase-section" class="section">
        <input
          type="password"
          id="passphrase"
          placeholder="Encryption Passphrase (optional)"
        />
      </div>
      <div id="save-section" class="section">
        <div class="input-row">
          <input
            type="text"
            id="accountName"
            placeholder="Account Name (e.g. Coda #1)"
            maxlength="100"
          />
        </div>
        <button
          id="saveBtn"
          type="button"
          class="main-btn"
          style="margin-top: 8px"
        >
          Save Current Session
        </button>
      </div>
    </div>

    <div id="accounts"></div>
    <div id="empty-state" style="display: none">
      No saved sessions for this domain.
    </div>
    <div id="status"></div>

    <!-- All SVG symbols safely inside the hidden SVG tag -->
    <svg style="display: none">
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </symbol>
      <symbol id="icon-alert" viewBox="0 0 24 24">
        <path
          d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
        />
        <line x1="12" y1="9" x2="12" y2="13" />
        <line x1="12" y1="17" x2="12.01" y2="17" />
      </symbol>
      <symbol id="icon-bot" viewBox="0 0 24 24">
        <path d="M12 8V4H8" />
        <rect x="5" y="8" width="14" height="12" rx="2" />
        <path d="M9 12v3M15 12v3" />
      </symbol>
      <symbol id="icon-hourglass" viewBox="0 0 24 24">
        <path
          d="M18 19v-2c0-1.66-1.34-3-3-3l-1-.5-.5-1-.5-1L8 8V6a4 4 0 011-3l.5-.5H12l.5.5V8h4l.5.5.5.5.5 1 1 2v4a4 4 0 011 3l.5.5H18"
        />
        <path
          d="M6 5v2c0 1.66 1.34 3 3 3l1 .5.5 1 .5 1L16 16v2a4 4 0 01-1 3l-.5.5H12l-.5-.5V16h-4l-.5-.5-.5-.5-.5-1-1-2v-4A4 4 0 016 5l-.5-.5H6"
        />
        <path d="M8 8V6" />
        <path d="M16 8V6" />
        <path d="M8 16v2" />
        <path d="M16 16v2" />
      </symbol>
      <symbol id="icon-check-circle" viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6" />
        <path
          d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"
        />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
      </symbol>
      <symbol id="icon-lock" viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </symbol>
    </svg>

    <div id="export-import-section" class="bottom-toolbar">
      <button
        id="exportBtn"
        type="button"
        class="action-btn"
        style="flex: 1; justify-content: center"
      >
        Export All Accounts
      </button>
      <button
        id="importBtn"
        type="button"
        class="action-btn"
        style="flex: 1; justify-content: center"
      >
        Import Accounts
      </button>
      <input
        type="file"
        id="importFile"
        accept="application/json"
        style="display: none"
      />
    </div>

    <div id="clear-section" class="bottom-toolbar">
      <button
        id="clearBtn"
        type="button"
        class="action-btn delete"
        style="width: 100%; justify-content: center; padding: 7px"
        aria-label="Clear cookies and site data"
      >
        Clear Cookies & Site Data
      </button>
    </div>

    <script src="browser-compat.js"></script>
    <script src="crypto-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
