<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>SessionSwitcher</title>
    <style>
      :root {
        /* New Color Palette derived from image_0.png */
        --bg: #103043; /* Dark Navy (Top) */
        --panel: #4b4e5f; /* Slate (Second) */
        --accent: #dca58d; /* Peach (Bottom) */
        --danger: #9c736c; /* Rose (Third) */

        /* Functional Colors */
        --success: #4fd18b; /* Existing Green for 'Ready' */
        --warning: #e09f3d; /* Existing Orange for 'Cooldown' */

        /* Text & Borders */
        --text: #eceef2;
        --muted: #bdbdbd;
        --border: #6b7181;
      }

      * {
        box-sizing: border-box;
      }

      body {
        width: 350px;
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      /* SVG Icons styling */
      .ss-icon {
        width: 1em;
        height: 1em;
        display: inline-block;
        vertical-align: middle;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      header {
        padding: 12px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      header h1 {
        font-size: 14px;
        margin: 0;
        font-weight: 600;
      }
      #domain {
        font-size: 11px;
        color: var(--muted);
      }

      #passphrase-section {
        padding: 10px 14px;
        background: #0d2636;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #passphrase {
        flex: 1;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 12px;
      }

      #save-section {
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .input-row {
        display: flex;
        gap: 6px;
      }
      #accountName {
        flex: 1;
        padding: 6px 8px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        font-size: 13px;
      }

      .preset-row {
        display: flex;
        gap: 4px;
        align-items: center;
        font-size: 11px;
        color: var(--muted);
      }
      .chip-btn {
        background: var(--panel);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 3px 6px;
        border-radius: 4px;
        font-size: 10px;
        cursor: pointer;
      }
      .chip-btn:hover {
        background: var(--accent);
        color: var(--bg);
      }

      button.main-btn {
        cursor: pointer;
        border: none;
        border-radius: 6px;
        font-size: 12px;
        padding: 7px 10px;
        font-weight: 600;
        background: var(--accent);
        color: var(--bg);
      }
      button.main-btn:hover {
        filter: brightness(1.1);
      }

      #accounts {
        max-height: 280px;
        overflow-y: auto;
        padding: 4px 0;
      }
      .account-card {
        padding: 10px 14px;
        border-bottom: 1px solid #2a2b35;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .account-card:hover {
        background: var(--panel);
      }
      .card-header {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .account-title-area {
        flex: 1;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .account-icon {
        font-size: 1.3em;
        color: var(--accent);
      }

      .quota-badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 10px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .badge-icon {
        font-size: 1.2em;
      }

      .quota-ready {
        background: #2e4d3a;
        color: var(--success);
      }
      .quota-cooldown {
        background: #4d3a2e;
        color: var(--warning);
      }

      .card-actions {
        display: flex;
        gap: 6px;
        margin-top: 4px;
        justify-content: flex-end;
      }
      .action-btn {
        background: #343642;
        border: none;
        color: var(--text);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .action-btn:hover {
        background: var(--accent);
        color: var(--bg);
      }
      .action-btn.delete:hover {
        background: var(--danger);
        color: var(--text);
      }

      #empty-state {
        padding: 20px 14px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      #status {
        padding: 8px 14px;
        font-size: 11px;
        color: var(--muted);
        min-height: 14px;
      }
      #status.error {
        color: #ff7676;
      }
      #status.success {
        color: var(--success);
      }

      .account-card.active-account {
        border-left: 3px solid var(--success);
        background: rgba(79, 209, 139, 0.08);
      }
      .active-badge {
        font-size: 10px;
        color: var(--success);
        font-weight: 600;
        margin-left: 6px;
        white-space: nowrap;
      }
      .no-match-note {
        padding: 10px 14px;
        font-size: 11px;
        color: var(--muted);
        text-align: center;
        font-style: italic;
      }

      .warning-badge {
        font-size: 10px;
        color: #ff7676;
        font-weight: 600;
        margin-left: 6px;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 3px;
      }

      .account-card.critical-warning {
        border-left: 3px solid #ff4b4b;
        background: rgba(255, 75, 75, 0.12);
      }
      .critical-badge {
        font-size: 10px;
        color: #ff4b4b;
        font-weight: 600;
        margin-left: 6px;
        white-space: nowrap;
        display: flex;
        align-items: center;
        gap: 3px;
      }
    </style>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <path
        d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"
      />
      <line x1="12" y1="9" x2="12" y2="13" />
      <line x1="12" y1="17" x2="12.01" y2="17" />
    </symbol>
  </head>
  <body>
    <header>
      <h1>SessionSwitcher</h1>
      <div id="domain">Loading domain…</div>
    </header>

    <div id="passphrase-section">
      <input
        type="password"
        id="passphrase"
        placeholder="Encryption Passphrase (optional)"
      />
    </div>
    <div id="save-section">
      <div class="input-row">
        <!-- Icon selector removed for classy minimalism. Bot icon default. -->
        <input
          type="text"
          id="accountName"
          placeholder="Account Name (e.g. Cauda #1)"
          maxlength="30"
        />
      </div>
      <div class="preset-row">
        <span>Quota resets in:</span>
        <button class="chip-btn" data-hours="3">+3h</button>
        <button class="chip-btn" data-hours="4">+4h</button>
        <button class="chip-btn" data-hours="5">+5h</button>
        <button class="chip-btn" data-hours="0">None</button>
        <input type="hidden" id="quotaResetOffset" value="0" />
        <span id="selectedResetText"></span>
      </div>
      <button id="saveBtn" class="main-btn">Save Current Session</button>
    </div>

    <div id="accounts"></div>
    <div id="empty-state" style="display: none">
      No saved sessions for this domain.
    </div>
    <div id="status"></div>

    <!-- SVG Symbols for use via <use href="#id"></use> -->
    <svg style="display: none">
      <symbol id="icon-bot" viewBox="0 0 24 24">
        <path d="M12 8V4H8" />
        <rect x="5" y="8" width="14" height="12" rx="2" />
        <path d="M9 12v3M15 12v3" />
      </symbol>
      <symbol id="icon-hourglass" viewBox="0 0 24 24">
        <path
          d="M18 19v-2c0-1.66-1.34-3-3-3l-1-.5-.5-1-.5-1L8 8V6a4 4 0 011-3l.5-.5H12l.5.5V8h4l.5.5.5.5.5 1 1 2v4a4 4 0 011 3l.5.5H18"
        />
        <path
          d="M6 5v2c0 1.66 1.34 3 3 3l1 .5.5 1 .5 1L16 16v2a4 4 0 01-1 3l-.5.5H12l-.5-.5V16h-4l-.5-.5-.5-.5-.5-1-1-2v-4A4 4 0 016 5l-.5-.5H6"
        />
        <path d="M8 8V6" />
        <path d="M16 8V6" />
        <path d="M8 16v2" />
        <path d="M16 16v2" />
      </symbol>
      <symbol id="icon-check-circle" viewBox="0 0 24 24">
        <path d="M22 11.08V12a10 10 0 11-5.93-9.14" />
        <polyline points="22 4 12 14.01 9 11.01" />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <polyline points="3 6 5 6 21 6" />
        <path
          d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"
        />
        <line x1="10" y1="11" x2="10" y2="17" />
        <line x1="14" y1="11" x2="14" y2="17" />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </symbol>
    </svg>

    <div
      id="export-import-section"
      style="
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 6px;
      "
    >
      <button
        id="exportBtn"
        class="action-btn"
        style="flex: 1; justify-content: center"
      >
        Export All Accounts
      </button>
      <button
        id="importBtn"
        class="action-btn"
        style="flex: 1; justify-content: center"
      >
        Import Accounts
      </button>
      <input
        type="file"
        id="importFile"
        accept="application/json"
        style="display: none"
      />
    </div>

    <div
      id="clear-section"
      style="padding: 10px 14px; border-bottom: 1px solid var(--border)"
    >
      <button
        id="clearBtn"
        class="action-btn delete"
        style="width: 100%; justify-content: center; padding: 7px"
      >
        Clear Cookies & Site Data
      </button>
    </div>

    <script src="browser-compat.js"></script>
    <script src="crypto-utils.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
